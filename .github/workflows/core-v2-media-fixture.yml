name: CORE V2 synthetic media gate

on:
  pull_request:
    paths:
      - tools/core_v2_media_fixture.py
      - tests/test_core_v2_media_fixture.py
      - tests/fixtures/core-v2/**
      - tests/requirements-core-fixture.txt
      - companion/video_recipe.py
      - companion/video_jobs.py
      - companion/local_video.py
      - engine
      - .github/workflows/core-v2-media-fixture.yml

permissions:
  contents: read

concurrency:
  group: core-media-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-component-export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Engine only
        run: git submodule update --init --depth 1 engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated test dependencies
        run: python -m pip install -r tests/requirements-core-fixture.txt
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Existing recipe regression
        run: python -m pytest tests/test_local_video.py -k 'recipe or neutral_interval' -q
      - name: Real component render and negative quality checks
        env:
          MONTARA_CORE_FIXTURE_RENDER: '1'
        run: python -m pytest tests/test_core_v2_media_fixture.py -q --basetemp='${{ runner.temp }}/montara-core-fixture'
      - name: Synthetic quality evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: core-media-quality-linux
          path: |
            ${{ runner.temp }}/montara-core-fixture/**/quality-report.json
            ${{ runner.temp }}/montara-core-fixture/**/fixture-manifest.json
          if-no-files-found: error
          retention-days: 7
