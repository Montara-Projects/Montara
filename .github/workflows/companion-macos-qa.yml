name: Companion macOS QA (no publication)
on:
  pull_request:
    paths:
      - 'companion/macos-installer/**'
      - 'companion/install.sh'
      - 'tests/companion-native-installer.test.cjs'
      - '.github/workflows/companion-macos-qa.yml'
  push:
    branches: [main]
    paths:
      - 'companion/macos-installer/**'
      - 'companion/install.sh'
      - 'tests/companion-native-installer.test.cjs'
      - '.github/workflows/companion-macos-qa.yml'
  workflow_dispatch:

# Read-only CI: no Apple signing credentials, no releases, no deployment.
permissions:
  contents: read

jobs:
  qa-only:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native installer safety contracts
        run: node --test tests/companion-native-installer.test.cjs
      - name: Build Apple Installer QA package
        shell: bash
        run: |
          set -euo pipefail
          MONTARA_PKG_VERSION=1.0.0 bash companion/macos-installer/build.sh
          files=(dist/*.pkg)
          test "${#files[@]}" -eq 1
          test -s "${files[0]}"
          file "${files[0]}"
          pkgutil --expand "${files[0]}" "$RUNNER_TEMP/montara-qa-expanded"
          test -d "$RUNNER_TEMP/montara-qa-expanded"
          echo 'QA package built. No signing, notarization, publishing, or install.'
