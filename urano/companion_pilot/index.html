<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montara Work · Companion</title>
<link rel="stylesheet" href="panel.css">
<main>
  <h1>Companion HTTPS</h1>
  <p id="connection" role="status">Buscando Companion…</p>
  <button id="connect">Conectar Companion</button>
  <section id="pairing" hidden>
    <p>Abre Companion QA y pega este código en su flujo de emparejamiento. Caduca en cinco minutos.</p>
    <output id="code"></output>
    <button id="hide-code">Ocultar código</button>
  </section>
  <div id="devices"></div>
  <form id="render">
    <label>Proyecto <select id="project" required></select></label>
    <label>Dispositivo <select id="device" required></select></label>
    <button id="start" disabled>Iniciar render</button>
  </form>
  <p id="state" role="status"></p>
  <progress id="progress" max="100" value="0" aria-label="Progreso del render"></progress>
  <button id="cancel" hidden>Cancelar render</button>
  <a id="download" hidden>Descargar MP4</a>
  <p id="error" role="alert"></p>
</main>
<script src="panel.js"></script>
</html>
